name: Trigger auto deployment for tickethive-identity

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ dev, main, feature/azure-deployment ]
    paths:
    - '**'
    - '.github/workflows/tickethive-identity-AutoDeployTrigger-37b5ad47-cdaa-4ce6-be79-a4bfe83a1d3e.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Solution Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TICKETHIVEIDENTITY_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TICKETHIVEIDENTITY_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TICKETHIVEIDENTITY_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: services/Identity/Dockerfile
          registryUrl: tickethiveacr.azurecr.io
          registryUsername: ${{ secrets.TICKETHIVEIDENTITY_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TICKETHIVEIDENTITY_REGISTRY_PASSWORD }}
          containerAppName: tickethive-identity
          resourceGroup: TicketHive-RG
          imageToBuild: tickethiveacr.azurecr.io/tickethive-identity:${{ github.sha }}



