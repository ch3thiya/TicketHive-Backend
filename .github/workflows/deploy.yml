name: Deploy

# Continuous deployment: merging dev into main releases into Azure.
#
# Nothing is built here. delivery.yml already built and pushed an image for
# each service, tagged with the dev commit. A merge commit's second parent IS
# that dev commit, so this workflow promotes the exact image CI tested rather
# than rebuilding from the same source and hoping it matches.
#
# This requires main to be updated by a merge commit, never a squash or a
# direct push (ADR-016 already requires merge commits).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: 'Single service to deploy, or "all"'
        required: true
        default: all
        type: choice
        options: [all, identity, catalog, inventory, waitingroom, booking, payment, notification]
      image_tag:
        description: 'Image tag to promote (a dev commit SHA, or dev-latest)'
        required: false
        default: dev-latest

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      any: ${{ steps.detect.outputs.any }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # both parents of the merge commit must be present

      - id: detect
        run: |
          set -euo pipefail
          all='["identity","catalog","inventory","waitingroom","booking","payment","notification"]'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.service }}" = "all" ]; then
              echo "services=$all" >> "$GITHUB_OUTPUT"
            else
              echo 'services=["${{ inputs.service }}"]' >> "$GITHUB_OUTPUT"
            fi
            echo "any=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The dev commit this merge brought in. Its image was built by
          # delivery.yml and tested by CI.
          if ! dev_sha="$(git rev-parse --verify --quiet HEAD^2)"; then
            echo "::error::main was not updated by a merge commit, so there is no delivered image to promote. Merge dev into main with a merge commit."
            exit 1
          fi
          echo "promoting images built from dev commit ${dev_sha}"
          echo "tag=${dev_sha}" >> "$GITHUB_OUTPUT"

          # Everything that accumulated on dev since the last release.
          changed="$(git diff --name-only HEAD~1 HEAD)"
          echo "changed since the last release:"; echo "$changed"

          if grep -qE '^services/BuildingBlocks/|^TicketHive\.slnx$|^\.github/workflows/deploy\.yml$' <<<"$changed"; then
            echo "services=$all" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          list=()
          for svc in Identity Catalog Inventory WaitingRoom Booking Payment Notification; do
            grep -q "^services/${svc}/" <<<"$changed" && \
              list+=("\"$(echo "$svc" | tr '[:upper:]' '[:lower:]')\"")
          done

          if [ ${#list[@]} -eq 0 ]; then
            echo "services=[]" >> "$GITHUB_OUTPUT"; echo "any=false" >> "$GITHUB_OUTPUT"
          else
            printf -v joined '%s,' "${list[@]}"
            echo "services=[${joined%,}]" >> "$GITHUB_OUTPUT"; echo "any=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: ${{ fromJson(needs.plan.outputs.services) }}

    concurrency:
      group: deploy-${{ matrix.service }}
      cancel-in-progress: false

    steps:
      - name: Resolve names
        id: names
        run: |
          echo "app=tickethive-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "job=tickethive-${{ matrix.service }}-migrate" >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.ACR_LOGIN_SERVER }}/tickethive-${{ matrix.service }}:${{ needs.plan.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Fail here rather than halfway through a deploy if delivery never ran
      # for this service, or its image has been cleaned up.
      - name: Confirm the image exists
        run: |
          set -euo pipefail
          login_server="${{ vars.ACR_LOGIN_SERVER }}"
          if ! az acr repository show-tags \
                --name "${login_server%%.*}" \
                --repository "tickethive-${{ matrix.service }}" \
                --query "[?@=='${{ needs.plan.outputs.tag }}'] | [0]" -o tsv | grep -q .; then
            echo "::error::${{ steps.names.outputs.image }} is not in the registry. Did delivery.yml run for this service on dev?"
            exit 1
          fi
          echo "promoting ${{ steps.names.outputs.image }}"

      # Migrations run before the new code does. A failure here stops the
      # deploy, so the old revision keeps serving.
      - name: Run migrations
        run: |
          set -euo pipefail
          az containerapp job update -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ steps.names.outputs.job }}" \
            --image "${{ steps.names.outputs.image }}" -o none

          execution="$(az containerapp job start -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ steps.names.outputs.job }}" --query name -o tsv)"
          echo "execution: $execution"

          for i in $(seq 1 60); do
            status="$(az containerapp job execution show \
              -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
              -n "${{ steps.names.outputs.job }}" \
              --job-execution-name "$execution" \
              --query properties.status -o tsv)"
            echo "  [$i] $status"
            case "$status" in
              Succeeded) echo "migrations applied"; exit 0 ;;
              Failed|Degraded)
                echo "::error::migration job $status"
                az containerapp job logs show -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
                  -n "${{ steps.names.outputs.job }}" \
                  --container "${{ steps.names.outputs.job }}" --tail 50 || true
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::migration job did not finish within 10 minutes"
          exit 1

      - name: Update the app
        run: |
          az containerapp update -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ steps.names.outputs.app }}" \
            --image "${{ steps.names.outputs.image }}" -o none

      # The update command succeeding is not the same as the new revision
      # working, so the deploy is only green once the service answers.
      - name: Verify the new revision
        run: |
          set -euo pipefail
          revision="$(az containerapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ steps.names.outputs.app }}" \
            --query properties.latestRevisionName -o tsv)"
          echo "revision: $revision"

          for i in $(seq 1 30); do
            state="$(az containerapp revision show -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ steps.names.outputs.app }}" --revision "$revision" \
              --query properties.runningState -o tsv)"
            echo "  [$i] $state"
            case "$state" in
              Running|RunningAtMaxScale) echo "revision healthy"; break ;;
              Failed|Degraded) echo "::error::revision $state"; exit 1 ;;
            esac
            sleep 10
          done

          fqdn="$(az containerapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ steps.names.outputs.app }}" \
            --query properties.configuration.ingress.fqdn -o tsv)"

          for i in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://${fqdn}/health/ready" || echo 000)"
            echo "  health/ready -> $code"
            [ "$code" = "200" ] && { echo "released: https://${fqdn}"; exit 0; }
            sleep 15
          done
          echo "::error::${{ steps.names.outputs.app }} did not report ready"
          exit 1

  summary:
    needs: [plan, deploy]
    if: always() && needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "### Release: ${{ needs.deploy.result }}"
            echo "Services: ${{ needs.plan.outputs.services }}"
            echo "Promoted image tag: ${{ needs.plan.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"